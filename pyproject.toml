[project]
name = "go2-server"
version = "0.1.0"
description = "Servidor de inferência e despacho de comandos de voz do Go2 (NEURON/UFLA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "sentence-transformers>=3.0",
    "torch>=2.3",
]

[project.optional-dependencies]
# Só para o benchmark e para quem escolher GO2S_STT_ENGINE=vosk.
vosk = ["vosk>=0.3.45"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "psutil>=5.9",
]

# torch só de CPU: o wheel padrão do PyPI traz ~2 GB de CUDA que o PC não usa.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "model: usa o modelo de embeddings real (pulado se não estiver em cache)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
